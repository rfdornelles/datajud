name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: R ${{ matrix.r }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A versão mínima documentada e a versão estável corrente.
        r: ['4.1', 'release']

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Instalar dependências
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::rcmdcheck

      - name: Executar R CMD check
        uses: r-lib/actions/check-r-package@v2

  # A integração real é opcional e nunca bloqueia a suíte determinística.
  integracao-api:
    name: Integração opcional com a API
    if: ${{ vars.DATAJUD_INTEGRACAO == 'true' }}
    runs-on: ubuntu-latest
    env:
      CNJ_API_KEY: ${{ secrets.CNJ_API_KEY }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Instalar dependências
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
          extra-packages: any::rcmdcheck
      - name: Executar teste de integração protegido
        run: |
          if [ -z "$CNJ_API_KEY" ]; then
            echo "Segredo CNJ_API_KEY não configurado; integração ignorada."
            exit 0
          fi
          if [ -f tests/testthat/test-integracao-api.R ]; then
            Rscript -e 'testthat::test_file("tests/testthat/test-integracao-api.R")'
          else
            echo "Nenhum teste de integração habilitado."
          fi
